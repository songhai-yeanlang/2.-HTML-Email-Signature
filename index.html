<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Email Signature</title>
</head>
<body style="margin: 0; padding: 0;">

<!-- Email Signature Table -->
<!-- Using strict table layout with 600px width as per guidelines -->
<table width="600" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; background-color: #ffffff; color: #000000; width: 600px; margin: 30px;">
  <tr>
    <!-- Left Column: Profile Picture -->
    <td width="160" valign="middle">
      <img src="https://preview.redd.it/is-this-what-people-mean-when-they-say-dark-and-handsome-v0-stn2x0lr70ae1.png?width=640&crop=smart&auto=webp&s=3af5bd104a6ba31f82aa04f7b85a93ac827eb52c" alt="Sophia Williams" width="160" height="200" style="display: block; border: none; object-fit: cover;" />
    </td>

    <!-- Space -->
    <td width="15"></td>

    <!-- Middle Column: Details -->
    <td width="230" valign="middle">
      <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, Arial, sans-serif; font-size: 28px; color: #000000; line-height: 1.2;">
            Yeanlang S.
          </td>
        </tr>
        <tr>
          <td style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; color: #000000; padding-top: 5px; padding-bottom: 15px;">
            Graphic Designer
          </td>
        </tr>
        <tr>
          <td>
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="20" valign="middle" style="padding-bottom: 5px;">
                  <img src="https://img.icons8.com/ios-filled/24/000000/phone.png" alt="Phone" width="14" height="14" style="display: block; border: none;" />
                </td>
                <td style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #333333; padding-bottom: 5px;">
                   +123-456-789
                </td>
              </tr>
              <tr>
                <td width="20" valign="middle" style="padding-bottom: 5px;">
                  <img src="https://img.icons8.com/ios-filled/24/000000/new-post.png" alt="Email" width="14" height="14" style="display: block; border: none;" />
                </td>
                <td style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #333333; padding-bottom: 5px;">
                  info@youremail.com
                </td>
              </tr>
              <tr>
                <td width="20" valign="middle" style="padding-bottom: 5px;">
                  <img src="https://img.icons8.com/ios-filled/24/000000/domain.png" alt="Website" width="14" height="14" style="display: block; border: none;" />
                </td>
                <td style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #333333; padding-bottom: 5px;">
                  www.yourwebsite.com
                </td>
              </tr>
              <tr>
                <td width="20" valign="middle" style="padding-bottom: 5px;">
                  <img src="https://img.icons8.com/ios-filled/24/000000/marker.png" alt="Address" width="14" height="14" style="display: block; border: none;" />
                </td>
                <td style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #333333; padding-bottom: 5px;">
                   123 Anywhere, Any City, 4/56
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; color: #000000; padding-top: 15px;">
            Logo Design | Brand Identity | Social Media Design
          </td>
        </tr>
      </table>
    </td>

    <!-- Space -->
    <td width="15"></td>

    <!-- Divider Line -->
    <td width="1" style="background-color: #d3d3d3;"></td>

    <!-- Space -->
    <td width="15"></td>

    <!-- Right Column: Logo & Socials -->
    <td width="164" valign="middle" align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" style="padding-bottom: 10px;">
            <img src="https://img.icons8.com/ios-filled/100/000000/hexagon.png" alt="Logo" width="50" height="50" style="display: block; border: none;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; color: #000000; padding-bottom: 3px;">
            YOUR BRAND NAME
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 8px; color: #000000; letter-spacing: 1px; padding-bottom: 15px;">
            -YOUR TAGLINE HERE-
          </td>
        </tr>
        <tr>
          <td align="center">
            <!-- Social Icons Table -->
            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto;">
              <tr>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/instagram-new.png" alt="IG" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/whatsapp--v1.png" alt="WA" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/facebook-new.png" alt="FB" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/twitterx--v1.png" alt="X" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/youtube-play.png" alt="YT" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/pinterest--v1.png" alt="PIN" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/linkedin.png" alt="IN" width="16" height="16" style="display: block; border: none;" /></a></td>
                <td style="padding: 0 2px;"><a href="#" style="text-decoration: none;"><img src="https://img.icons8.com/ios-filled/30/000000/skype.png" alt="SK" width="16" height="16" style="display: block; border: none;" /></a></td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
